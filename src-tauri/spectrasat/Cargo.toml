[package]
name = "spectrasat"
version = "1.0.0"
description = "High-Performance Symbolic Coprocessor for AI Agents"
authors = ["SpectraSAT Team"]
edition = "2021"
default-run = "spectrasat_stdio"

[lib]
name = "spectrasat_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "spectrasat_stdio"
path = "src/bin/spectrasat_stdio.rs"

[[bin]]
name = "benchmark_suite"
path = "src/bin/benchmark_suite.rs"

[features]
# Solo activa PyO3 cuando se quiere construir la extensión Python (.pyd/.so)
python-ext = ["dep:pyo3"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10.0"
faer = "0.19.4"
wide = "0.7.33"
rand = "0.8"

# PyO3 es OPCIONAL — solo para la extensión Python, no para uso como librería Rust
pyo3 = { version = "0.20", features = ["extension-module"], optional = true }
