[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
chronos_vfs = { package = "nvm_prototype", path = "memory_vfs" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1.52.3", features = ["full"] }
ignore = "0.4.25"
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.13.3", features = ["json"] }
scraper = "0.27.0"
regex = "1.12.3"
ego-tree = "0.11.0"
chrono = "0.4.45"
sysinfo = "0.36.1"
urlencoding = "2.1.3"
xcap = "0.9.6"
base64 = "0.22.1"
image = "0.25.6"
uuid = { version = "1.20.0", features = ["v4"] }

[[example]]
name = "test_auto_validation"
path = "examples/test_auto_validation.rs"
