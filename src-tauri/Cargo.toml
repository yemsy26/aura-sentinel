[package]
name = "app"
default-run = "app"
version = "4.6.0"
description = "Aura Sentinel: IDE de escritorio con un agente de programación local"
authors = ["Ramón Antonio Burgos Jerez (yemsy26)"]
license = "MIT"
repository = "https://github.com/yemsy26/aura-sentinel"
homepage = "https://github.com/yemsy26/aura-sentinel"
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = [] }
tokio = { version = "1.52.3", features = ["full"] }
ignore = "0.4.25"
tauri-plugin-dialog = "2.7.1"
reqwest = { version = "0.13.3", features = ["json"] }
sysinfo = "0.36.1"
uuid = { version = "1.20.0", features = ["v4"] }
sha2 = "0.10.9"

[[bin]]
name = "aura-diagnostics"
path = "src/diagnose_main.rs"

[profile.release]
lto = "thin"   # binario más pequeño y algo más rápido
strip = true
