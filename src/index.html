<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA-SENTINEL</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Monaco Editor AMD loader -->
    <script>var require = { paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } };</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.nls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/editor/editor.main.js"></script>
</head>
<body>
    <div class="grid-container">
        <!-- Panel Izquierdo: rbol de carpetas del espacio de trabajo -->
        <div class="panel panel-left" id="workspace-panel">
            <div class="panel-header">
                <div style="display:flex;align-items:center;gap:10px;">
                    WORKSPACE
                    <button id="load-workspace-btn" class="action-btn" style="padding: 2px 6px; font-size:10px;">[+] Cargar</button>
                </div>
                <div class="panel-controls"><button class="min-btn" title="Minimizar/Restaurar">−</button></div>
            </div>
            <div class="panel-content" id="workspace-tree">
                <!-- rbol de directorios renderizado aqu -->
            </div>
        </div>

        <div class="gutter gutter-horizontal" id="gutter-1"></div>

        <!-- Panel Central: Monaco Editor -->
        <div class="panel panel-editor" id="editor-wrapper">
            <div class="panel-header editor-tabs-header" id="editor-tabs" style="display: flex; align-items: flex-end; overflow-x: auto; padding: 0; min-height: 35px; background: #010409;">
                <!-- Tabs rendered here dynamically -->
                <div style="padding: 8px; color: #8b949e; font-size: 12px; font-style: italic;" id="no-tabs-msg">Abre un archivo desde el Workspace</div>
            </div>
            <div class="panel-content" id="editor-container" style="padding: 0; overflow: hidden;">
                <!-- Editor container -->
                <div id="monaco-editor-host" style="width: 100%; height: 100%;"></div>
            </div>
        </div>

        <div class="gutter gutter-horizontal" id="gutter-2"></div>

        <div class="panel-right-stack">
            <!-- Chat de usuario con el orquestador -->
            <div class="panel chat-panel" id="chat-panel" style="flex: 2;">
                <div class="panel-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="display:flex;align-items:center;gap:10px;">
                        <span>ORCHESTRATOR LINK</span>
                        <button id="clear-chat-btn" class="action-btn" style="padding: 2px 8px; font-size: 10px; background:#f85149; border:none;">&#x1F5D1; Limpiar</button>
                    </div>
                    <div class="panel-controls"><button class="min-btn" title="Minimizar/Restaurar">−</button></div>
                </div>
                
                <div style="padding: 5px 10px; background: #0d1117; border-bottom: 1px solid #30363d; display: flex; gap: 10px; align-items: center;">
                    <label style="color: #8b949e; font-size: 11px;">Orquestador:</label>
                    <select id="orchestrator-select" style="background: #010409; color: #c9d1d9; border: 1px solid #30363d; font-size: 11px; padding: 2px; border-radius: 4px; flex-grow: 1;"></select>
                    <label style="color: #8b949e; font-size: 11px;">Programador:</label>
                    <select id="programmer-select" style="background: #010409; color: #c9d1d9; border: 1px solid #30363d; font-size: 11px; padding: 2px; border-radius: 4px; flex-grow: 1;"></select>
                </div>
                <div class="panel-content" id="chat-messages">
                    <div style="color: #8b949e; text-align: center; margin-top: 20px;">Esperando instrucciones tcticas...</div>
                </div>
                <div class="chat-input-container">
                    <input type="text" id="chat-input" placeholder="Enviar instruccion a Aura...">
                </div>
            </div>

            <!-- PESP v2 Phase Progress Bar -->
            <div id="phase-progress-container" style="display: none; padding: 10px; background: #0d1117; border: 1px solid #30363d; margin-top: 5px; border-radius: 6px;">
                <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; margin-bottom: 5px;">
                    <span id="phase-progress-text">[FASE 1/3] Inicializando...</span>
                    <span id="phase-progress-percentage">0%</span>
                </div>
                <div style="width: 100%; background-color: #21262d; border-radius: 4px; overflow: hidden; height: 8px;">
                    <div id="phase-progress-fill" style="width: 0%; height: 100%; background-color: #238636; transition: width 0.3s ease;"></div>
                </div>
            </div>

            <!-- Consola tcnica en tiempo real -->
            <div class="panel panel-console" id="console-panel" style="flex: 1.5; margin-top: 5px;">
                <div class="panel-header">
                <span>TECHNICAL CONSOLE [RUST & OLLAMA]</span>
                <div class="panel-controls"><button class="min-btn" title="Minimizar/Restaurar">−</button></div>
            </div>
                <div class="panel-content" id="system-thoughts">
                    <!-- Flujo de pensamientos aqu -->
                </div>
            </div>

            <!-- Monitor de telemetra ligero -->
            <div class="panel panel-telemetry" id="telemetry-panel" style="flex: 0 0 auto; margin-top: 5px;">
                <div class="panel-header" style="padding: 5px 10px; font-size: 10px;">
                <span>TELEMETRY</span>
                <div class="panel-controls"><button class="min-btn" title="Minimizar/Restaurar" style="font-size:10px;padding:0 4px;">−</button></div>
            </div>
                
                <div class="panel-content" id="telemetry-data" style="padding: 5px 10px; font-size: 11px; display: flex; flex-direction: column; gap: 5px;">
                    <div style="display: flex; justify-content: space-between; gap: 10px;">
                        <div class="telemetry-stat"><span style="color:#6e7681;">RAM:</span> <span id="ram-usage" style="color:#3fb950;">0 MB</span></div>
                        <div class="telemetry-stat"><span style="color:#6e7681;">Model:</span> <span id="model-status" style="color:#e3b341;">Standby</span></div>
                        <div class="telemetry-stat"><span style="color:#6e7681;">Session:</span> <span id="session-id" style="color:#58a6ff;">-</span></div>
                    </div>
                    <!-- BACKGROUND TASKS UI -->
                    <div id="bg-tasks-section" style="border-top: 1px dashed #30363d; padding-top: 5px; display: none;">
                        <span style="color:#6e7681; font-weight: bold;">BACKGROUND TASKS</span>
                        <div id="bg-tasks-list" style="margin-top: 5px; display: flex; flex-direction: column; gap: 4px;">
                            <!-- Dynamically populated -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="main.js"></script>

    <!-- Modal Ask User -->
    <div id="ask-user-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center;">
        <div style="background: #0d1117; border: 1px solid #30363d; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%;">
            <h3 style="margin-top: 0; color: #58a6ff;">Atención Requerida</h3>
            <p id="ask-user-question" style="font-size: 14px; margin-bottom: 20px; color: #c9d1d9;"></p>
            <div id="ask-user-options" style="display: flex; flex-direction: column; gap: 10px;">
                <!-- Botones inyectados desde JS -->
            </div>
            <div style="margin-top: 15px; border-top: 1px dashed #30363d; padding-top: 15px;">
                <label style="color: #8b949e; font-size: 12px; margin-bottom: 5px; display: block;">Respuesta Personalizada:</label>
                <input type="text" id="ask-user-custom" placeholder="Escribe instrucciones..." style="width: 100%; padding: 5px; background: #010409; border: 1px solid #30363d; color: #c9d1d9; border-radius: 4px;">
                <button id="ask-user-custom-btn" style="width: 100%; margin-top: 5px; background: #238636; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer;">Enviar</button>
            </div>
        </div>
    </div>

</body>
</html>
